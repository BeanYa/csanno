name: Publish to NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: Pub

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Clean dotnet Enviroment
      run: dotnet clean
    
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Get Version
      id: get_version
      shell: bash
      run: |
        REF_NAME="${{ github.event.release.tag_name || github.ref_name }}"
        VERSION=""
        IS_TAG="false"

        # Use tag version if ref looks like a semver tag (with optional v prefix)
        if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
          VERSION="${REF_NAME#v}"
          IS_TAG="true"
        else
          # Fallback to project version for workflow_dispatch / branch runs
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Csanno.csproj)"
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output nupkgs /p:Version=${{ steps.get_version.outputs.version }}

    - name: Publish to NuGet
      run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      if: steps.get_version.outputs.is_tag == 'true' || github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        files: nupkgs/*.nupkg
        generate_release_notes: true
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
